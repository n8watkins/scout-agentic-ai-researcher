# Render deploy config for Scout (agentic researcher).
# A Node web service: `npm ci` installs deps (libSQL ships prebuilt binaries —
# no native compile), then `next build` produces the production server.
# Saved runs use a local SQLite file (ephemeral on the free tier) unless you set
# TURSO_DATABASE_URL for durable storage. Secrets (sync: false) set in dashboard.
services:
  - type: web
    name: scout-agentic-researcher
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm ci && npm run build
    # Bind to Render's injected $PORT rather than the local dev port 3100.
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Shared demo Gemini key (optional; BYOK preferred). Set in dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: SCOUT_MODEL
        value: gemini-3.1-flash-lite
      # Demo model-call cap per rolling 24h on the shared key (this app's half
      # of a 500/day key shared with the voice agent).
      - key: SCOUT_DEMO_CALL_BUDGET
        value: "250"
      # Optional abuse-guard tuning (defaults: 8 runs/IP per hour, 60 run-
      # history writes/min). See src/lib/usage.ts.
      - key: SCOUT_PER_IP_RUN_LIMIT
        value: "8"
      - key: SCOUT_RUN_WRITE_LIMIT
        value: "60"
      # Web search keys (optional — falls back to keyless Wikipedia). Dashboard.
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Durable saved-run storage (optional). Without these, runs use a local
      # SQLite file that resets on redeploy. Create a free DB at turso.tech.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Optional GitHub sign-in (Auth.js) for cross-device sync. Without these
      # the app stays local-first. Callback: <url>/api/auth/callback/github
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://scout-agentic-researcher.onrender.com
